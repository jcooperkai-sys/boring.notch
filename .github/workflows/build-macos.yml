name: Build macOS (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [feature/verification-code-notch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project boringNotch.xcodeproj -scheme boringNotch
      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild build \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            ONLY_ACTIVE_ARCH=NO 2>&1 | tee build.log | grep -E "error:|warning: .*Verification|BUILD (SUCCEEDED|FAILED)" || true
          ls build/Build/Products/Release
          test -d "build/Build/Products/Release/Boring Notch.app"
      - name: Zip app
        run: |
          mkdir -p out
          ditto "build/Build/Products/Release/Boring Notch.app" out/boringNotch.app
          ditto -c -k --keepParent out/boringNotch.app boringNotch.zip
      - uses: actions/upload-artifact@v4
        with:
          name: boringNotch-app
          path: boringNotch.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
